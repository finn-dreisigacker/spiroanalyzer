# Baut die Browser-Version (Shinylive/webR) und veröffentlicht sie auf
# Cloudflare Pages. Benötigt die Repo-Secrets CLOUDFLARE_API_TOKEN und
# CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::plotly
            any::ggplot2
            any::dplyr
            any::tidyr
            any::tibble
            any::purrr
            any::stringr
            any::lubridate
            any::hms
            any::zoo
            any::xml2
            any::readxl
            any::openxlsx
            any::DT
            any::shinycssloaders
            any::htmlwidgets
            any::patchwork
            any::gridExtra
            any::officer
            any::zip
            any::golem
            any::config

      - name: Shinylive-Version bauen
        run: Rscript deploy/build_shinylive.R

      - name: Auf Cloudflare Pages veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=spiroanalyzer --branch=main
