# Baut die Browser-Version (Shinylive/webR) und legt sie auf den Branch
# "cloudflare-pages". Cloudflare Pages ist per "Connect to Git" mit diesem
# Branch verbunden (Build-Befehl leer, Ausgabeordner "/").
name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::plotly
            any::ggplot2
            any::dplyr
            any::tidyr
            any::tibble
            any::purrr
            any::stringr
            any::lubridate
            any::hms
            any::zoo
            any::xml2
            any::readxl
            any::openxlsx
            any::DT
            any::shinycssloaders
            any::htmlwidgets
            any::patchwork
            any::gridExtra
            any::officer
            any::zip
            any::golem
            any::config

      - name: Shinylive-Version bauen
        run: Rscript deploy/build_shinylive.R

      - name: Auf Branch cloudflare-pages legen
        run: |
          cd site
          touch .nojekyll
          git init -q -b cloudflare-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" cloudflare-pages
